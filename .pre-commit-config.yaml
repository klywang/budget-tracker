repos:
  # ruff and mypy run from the active environment, so requirements-dev.txt sets
  # their versions and mypy can see installed packages. Activate it before committing.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types_or: [python, pyi]
        exclude: ^tests/ # tests don't need type hints

  # gitleaks isn't a Python package, so pre-commit manages it.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
